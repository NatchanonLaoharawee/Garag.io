<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garag.io — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f0f0f0;
      padding: 1rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .logo span { color: #4ade80; }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .alert {
      background: #3b1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="password"] {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus { border-color: #4ade80; }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #aaa;
      cursor: pointer;
    }

    .remember input[type="checkbox"] {
      accent-color: #4ade80;
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }

    button[type="submit"] {
      margin-top: 1.5rem;
      width: 100%;
      background: #4ade80;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #22c55e; }
    button[type="submit"]:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Garag<span>.io</span></div>
    <p class="subtitle">Enter your access token to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
      <label for="token">Access Token</label>
      <input
        type="password"
        id="token"
        name="token"
        placeholder="••••••••••••"
        autocomplete="current-password"
        autofocus
        required
      />

      <label class="remember">
        <input type="checkbox" name="remember_me" />
        Remember me for 7 days
      </label>

      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
